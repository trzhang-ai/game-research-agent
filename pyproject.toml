[project]
name = "game-research-agent"
version = "0.1.0"
description = "Evidence-gated video-game research agent with hybrid retrieval and memory"
readme = "README.md"
authors = [
    { name = "James Chang" },
]
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=3.11.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.1",
    "typing-extensions>=4.16.0",
]

[project.urls]
Repository = "https://github.com/trzhang-ai/game-research-agent"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
